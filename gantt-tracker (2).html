<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Field Log — Progress Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#1B2A28;
    --ink-2:#233835;
    --parchment:#EDE6D6;
    --parchment-dim:#DAD2BE;
    --moss:#6B8F71;
    --moss-dark:#3F5A44;
    --amber:#C9A227;
    --amber-dark:#8A6D18;
    --rust:#A64B2A;
    --rust-dark:#6E3319;
    --fog:#9FB4B0;
    --water:#3E7C8C;
    --water-light:#A9CBD3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--parchment);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:2px solid var(--fog);
    padding-bottom:14px;margin-bottom:8px;
    flex-wrap:wrap;gap:12px;
  }
  .masthead h1{
    font-family:'Spectral',serif;font-weight:600;font-size:28px;margin:0;
    letter-spacing:0.5px;color:var(--parchment);
  }
  .masthead .sub{font-size:12px;color:var(--fog);letter-spacing:1px;text-transform:uppercase;}
  .masthead .meta{font-size:12px;color:var(--fog);text-align:right;line-height:1.6;}
  .masthead .meta b{color:var(--parchment);}

  .toolbar{
    display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;align-items:center;
  }
  .toolbar input[type=text]{flex:1;min-width:160px;}
  input,select{
    background:var(--ink-2);border:1px solid var(--fog);color:var(--parchment);
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:8px 10px;border-radius:2px;
  }
  input::placeholder{color:#6b7f7c;}
  button{
    background:var(--moss-dark);color:var(--parchment);border:1px solid var(--moss);
    font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 16px;
    border-radius:2px;cursor:pointer;letter-spacing:0.3px;
  }
  button:hover{background:var(--moss);}
  button.ghost{background:transparent;border:1px solid var(--fog);color:var(--fog);}
  button.ghost:hover{background:rgba(159,180,176,0.12);color:var(--parchment);}
  button.danger{background:transparent;border:1px solid var(--rust);color:var(--rust);padding:6px 10px;font-size:11px;}
  button.danger:hover{background:rgba(166,75,42,0.15);}

  .add-form{
    display:none;background:var(--ink-2);border:1px solid var(--fog);border-radius:4px;
    padding:16px;margin-bottom:20px;gap:10px;flex-wrap:wrap;
  }
  .add-form.open{display:flex;}
  .add-form .field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--fog);}
  .add-form label{text-transform:uppercase;letter-spacing:0.5px;}

  .legend{display:flex;gap:18px;font-size:11px;color:var(--fog);margin-bottom:14px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  .board{border:1px solid var(--fog);border-radius:4px;overflow:hidden;background:var(--ink-2);}
  .board-head{
    display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid var(--fog);
  }
  .board-head .site-col{padding:10px 14px;font-size:11px;color:var(--fog);text-transform:uppercase;letter-spacing:1px;border-right:1px solid var(--fog);}
  .timegrid{position:relative;overflow:hidden;}
  .timegrid .ticks{display:flex;height:32px;}
  .tick{flex:1;border-right:1px solid rgba(159,180,176,0.15);font-size:10px;color:var(--fog);
    display:flex;align-items:center;justify-content:center;white-space:nowrap;}

  .row{display:grid;grid-template-columns:220px 1fr;border-bottom:1px solid rgba(159,180,176,0.2);}
  .row:last-child{border-bottom:none;}
  .site-info{padding:12px 14px;border-right:1px solid var(--fog);position:relative;}
  .site-name{font-weight:500;font-size:13px;color:var(--parchment);margin-bottom:4px;}
  .site-owner{font-size:11px;color:var(--fog);}
  .site-pct{font-size:11px;color:var(--water-light);margin-top:4px;}
  .row-track{position:relative;height:100%;min-height:58px;}
  .track-svg{position:absolute;top:0;left:0;width:100%;height:100%;}

  .strip{
    position:absolute;top:10px;bottom:10px;border-radius:3px;overflow:hidden;
    border:1px solid rgba(0,0,0,0.25);cursor:pointer;
  }
  .strip .contour{position:absolute;inset:0;opacity:0.55;}
  .strip .water{position:absolute;top:0;bottom:0;left:0;background:var(--water);opacity:0.85;}
  .strip .label{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-size:10.5px;
    color:var(--parchment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,0.5);}

  .today-line{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed var(--amber);z-index:3;}
  .today-tag{position:absolute;top:-20px;transform:translateX(-50%);font-size:9px;color:var(--amber);white-space:nowrap;letter-spacing:0.5px;}

  .empty{padding:40px 14px;text-align:center;color:var(--fog);font-size:13px;}

  .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .panel-overlay.open{display:flex;}
  .panel{background:var(--ink-2);border:1px solid var(--fog);border-radius:6px;padding:22px;width:100%;max-width:380px;}
  .panel h3{font-family:'Spectral',serif;margin:0 0 14px;color:var(--parchment);font-size:18px;}
  .panel .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .panel label{font-size:11px;color:var(--fog);text-transform:uppercase;letter-spacing:0.5px;}
  .panel input[type=range]{width:100%;accent-color:var(--water);}
  .panel-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .panel-actions .right{display:flex;gap:8px;}

  .status-note{font-size:10.5px;color:var(--fog);margin-top:6px;line-height:1.5;}
  .sync{font-size:10px;color:var(--fog);margin-top:14px;text-align:center;}

  .mode-switch-wrap{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .mode-switch-label{font-size:11px;color:var(--fog);letter-spacing:0.5px;text-transform:uppercase;}
  .mode-switch{
    width:42px;height:22px;border-radius:11px;background:var(--ink);border:1px solid var(--fog);
    position:relative;cursor:pointer;flex-shrink:0;
  }
  .mode-switch .dot{
    position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:var(--fog);transition:left 0.15s ease, background 0.15s ease;
  }
  .mode-switch.on{background:var(--moss-dark);border-color:var(--moss);}
  .mode-switch.on .dot{left:22px;background:var(--parchment);}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <div class="sub" id="mode-label">Field progress log — shared board</div>
      <h1 id="board-title">Survey sites</h1>
    </div>
    <div class="meta">
      <div>Today · <b id="today-display"></b></div>
      <div><span id="site-count">0</span> sites tracked</div>
      <div class="mode-switch-wrap" style="justify-content:flex-end;">
        <span class="mode-switch-label" id="mode-switch-label">View only</span>
        <div class="mode-switch" id="mode-switch"><div class="dot"></div></div>
      </div>
    </div>
  </div>

  <div class="toolbar" id="admin-toolbar" style="display:none;">
    <button id="btn-toggle-add">+ New site</button>
    <button class="ghost" id="btn-rename">Rename board</button>
  </div>

  <div class="add-form" id="add-form">
    <div class="field" style="flex:2;min-width:160px;">
      <label>Site / task</label>
      <input type="text" id="in-name" placeholder="e.g. Larval survey — Zone 4">
    </div>
    <div class="field">
      <label>Owner</label>
      <input type="text" id="in-owner" placeholder="Optional">
    </div>
    <div class="field">
      <label>Start</label>
      <input type="date" id="in-start">
    </div>
    <div class="field">
      <label>End</label>
      <input type="date" id="in-end">
    </div>
    <div class="field" style="justify-content:flex-end;flex-direction:row;gap:8px;">
      <button id="btn-save-new">Add to board</button>
      <button class="ghost" id="btn-cancel-new">Cancel</button>
    </div>
  </div>

  <div class="legend">
    <span><span class="swatch" style="background:var(--water)"></span>Progress (water level)</span>
    <span><span class="swatch" style="background:var(--moss)"></span>On track</span>
    <span><span class="swatch" style="background:var(--amber)"></span>Behind pace</span>
    <span><span class="swatch" style="background:var(--rust)"></span>Overdue</span>
  </div>

  <div class="board" id="board">
    <div class="board-head">
      <div class="site-col">Site</div>
      <div class="timegrid"><div class="ticks" id="ticks"></div></div>
    </div>
    <div id="rows"></div>
  </div>

  <div class="sync">Connecting…</div>
</div>

<div class="panel-overlay" id="panel-overlay">
  <div class="panel">
    <h3 id="panel-title">Update progress</h3>
    <div class="field">
      <label>Progress: <span id="pct-out">0</span>%</label>
      <input type="range" id="in-progress" min="0" max="100" step="1" value="0">
    </div>
    <div class="field">
      <label>Start</label>
      <input type="date" id="edit-start">
    </div>
    <div class="field">
      <label>End</label>
      <input type="date" id="edit-end">
    </div>
    <div class="field">
      <label>Owner</label>
      <input type="text" id="edit-owner">
    </div>
    <div class="status-note" id="status-note"></div>
    <div class="panel-actions">
      <button class="danger" id="btn-delete">Remove site</button>
      <div class="right">
        <button class="ghost" id="btn-cancel-edit">Close</button>
        <button id="btn-save-edit">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var API_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
  var EDIT_PASSWORD = '11111111';
  var isAdmin = false;
  var sessionPassword = '';
  var tasks = [];
  var boardTitle = 'Survey sites';
  var activeId = null;
  var syncTimer = null;

  function setSyncNote(text){
    var el = document.querySelector('.sync');
    if(el) el.textContent = text;
  }

  function applyModeUI(){
    document.getElementById('mode-label').textContent = isAdmin
      ? 'Field progress log — edit mode'
      : 'Field progress log — read only';
    document.getElementById('mode-switch').classList.toggle('on', isAdmin);
    document.getElementById('mode-switch-label').textContent = isAdmin ? 'Edit mode' : 'View only';
    document.getElementById('admin-toolbar').style.display = isAdmin ? 'flex' : 'none';
    document.getElementById('btn-delete').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('btn-save-edit').style.display = isAdmin ? 'inline-block' : 'none';
    document.getElementById('in-progress').disabled = !isAdmin;
    document.getElementById('edit-start').disabled = !isAdmin;
    document.getElementById('edit-end').disabled = !isAdmin;
    document.getElementById('edit-owner').disabled = !isAdmin;
  }

  document.getElementById('mode-switch').addEventListener('click', function(){
    if(isAdmin){
      isAdmin = false;
      sessionPassword = '';
      applyModeUI();
      return;
    }
    var pw = prompt('Enter edit password');
    if(pw === null) return;
    if(pw === EDIT_PASSWORD){
      isAdmin = true;
      sessionPassword = pw;
      applyModeUI();
    }else{
      alert('Incorrect password.');
    }
  });

  applyModeUI();

  function uid(){ return 't' + Math.random().toString(36).slice(2,9); }
  function toDate(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtISO(d){ return d.toISOString().slice(0,10); }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }

  async function apiGet(){
    var res = await fetch(API_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('Network error');
    return res.json();
  }
  async function apiPost(payload){
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('Network error');
    var data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  }

  async function loadAll(){
    setSyncNote('Loading board…');
    try{
      var data = await apiGet();
      tasks = data.tasks || [];
      boardTitle = data.title || 'Survey sites';
      document.getElementById('board-title').textContent = boardTitle;
      render();
      setSyncNote('Shared board — synced ' + new Date().toLocaleTimeString());
    }catch(e){
      setSyncNote('Could not reach the sheet. Check the API_URL is set and deployed correctly.');
    }
  }

  function startAutoRefresh(){
    if(syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(loadAll, 15000);
  }

  function contourSVG(seed, width, height, colorClass){
    var lines = [];
    for(var i=0;i<3;i++){
      var amp = 6 + i*3;
      var yBase = (height/4)*(i+1);
      var d = 'M0,' + yBase;
      for(var x=0;x<=width;x+=14){
        var y = yBase + Math.sin((x+seed*17+i*40)/18)*amp*0.4;
        d += ' L' + x + ',' + y;
      }
      lines.push('<path d="'+d+'" fill="none" stroke="rgba(237,230,214,0.35)" stroke-width="1"/>');
    }
    return '<svg class="track-svg" viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="none">'+lines.join('')+'</svg>';
  }

  function computeStatusColor(t){
    var start = toDate(t.start), end = toDate(t.end), today = new Date();
    today.setHours(0,0,0,0);
    var total = Math.max(1, daysBetween(start,end));
    var elapsed = Math.min(total, Math.max(0, daysBetween(start, today)));
    var expected = Math.round((elapsed/total)*100);
    if(t.progress >= 100) return {color:'var(--moss)', label:'Complete'};
    if(today > end) return {color:'var(--rust)', label:'Overdue'};
    if(t.progress + 8 < expected) return {color:'var(--amber)', label:'Behind pace, expected ~' + expected + '%'};
    return {color:'var(--moss)', label:'On track'};
  }

  function render(){
    document.getElementById('site-count').textContent = tasks.length;
    document.getElementById('today-display').textContent = new Date().toDateString();

    var rowsEl = document.getElementById('rows');
    var ticksEl = document.getElementById('ticks');
    rowsEl.innerHTML = '';
    ticksEl.innerHTML = '';

    if(tasks.length === 0){
      rowsEl.innerHTML = '<div class="empty">No sites yet — add one to start the log.</div>';
      return;
    }

    var minDate = null, maxDate = null;
    tasks.forEach(function(t){
      var s = toDate(t.start), e = toDate(t.end);
      if(!minDate || s < minDate) minDate = s;
      if(!maxDate || e > maxDate) maxDate = e;
    });
    var today = new Date(); today.setHours(0,0,0,0);
    if(today < minDate) minDate = today;
    if(today > maxDate) maxDate = today;
    minDate = new Date(minDate.getTime() - 2*86400000);
    maxDate = new Date(maxDate.getTime() + 2*86400000);
    var totalDays = Math.max(1, daysBetween(minDate, maxDate));

    var weeks = Math.ceil(totalDays/7);
    for(var w=0; w<weeks; w++){
      var d = new Date(minDate.getTime() + w*7*86400000);
      var tick = document.createElement('div');
      tick.className = 'tick';
      tick.textContent = (d.getMonth()+1) + '/' + d.getDate();
      ticksEl.appendChild(tick);
    }

    tasks.forEach(function(t){
      var row = document.createElement('div');
      row.className = 'row';

      var info = document.createElement('div');
      info.className = 'site-info';
      info.innerHTML = '<div class="site-name">'+escapeHtml(t.name)+'</div>' +
        '<div class="site-owner">'+(t.owner? escapeHtml(t.owner) : '—')+'</div>' +
        '<div class="site-pct">'+t.progress+'% logged</div>';
      row.appendChild(info);

      var track = document.createElement('div');
      track.className = 'row-track';

      var s = toDate(t.start), e = toDate(t.end);
      var leftPct = (daysBetween(minDate,s)/totalDays)*100;
      var widthPct = (daysBetween(s,e)/totalDays)*100;
      widthPct = Math.max(widthPct, 2);

      var strip = document.createElement('div');
      strip.className = 'strip';
      strip.style.left = leftPct + '%';
      strip.style.width = widthPct + '%';
      strip.style.background = 'var(--ink)';

      var st = computeStatusColor(t);
      strip.innerHTML = contourSVG(t.name.length, 300, 40) +
        '<div class="water" style="width:'+t.progress+'%; background:'+st.color+'"></div>' +
        '<div class="label">'+escapeHtml(t.name)+'</div>';
      strip.title = st.label;
      strip.addEventListener('click', function(taskId){
        return function(){ openEdit(taskId); };
      }(t.id));
      track.appendChild(strip);

      var todayLeft = (daysBetween(minDate,today)/totalDays)*100;
      if(todayLeft >= 0 && todayLeft <= 100){
        var tl = document.createElement('div');
        tl.className = 'today-line';
        tl.style.left = todayLeft + '%';
        if(tasks.indexOf(t) === 0){
          tl.innerHTML = '<div class="today-tag">today</div>';
        }
        track.appendChild(tl);
      }

      row.appendChild(track);
      rowsEl.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  document.getElementById('btn-toggle-add').addEventListener('click', function(){
    var f = document.getElementById('add-form');
    f.classList.add('open');
    var today = fmtISO(new Date());
    document.getElementById('in-start').value = today;
    var endDefault = new Date(); endDefault.setDate(endDefault.getDate()+7);
    document.getElementById('in-end').value = fmtISO(endDefault);
  });
  document.getElementById('btn-cancel-new').addEventListener('click', function(){
    document.getElementById('add-form').classList.remove('open');
    document.getElementById('in-name').value = '';
    document.getElementById('in-owner').value = '';
  });
  document.getElementById('btn-save-new').addEventListener('click', async function(){
    var name = document.getElementById('in-name').value.trim();
    var owner = document.getElementById('in-owner').value.trim();
    var start = document.getElementById('in-start').value;
    var end = document.getElementById('in-end').value;
    if(!name || !start || !end){ return; }
    if(toDate(end) < toDate(start)){ end = start; }
    var newTask = { id: uid(), name:name, owner:owner, start:start, end:end, progress:0 };
    this.disabled = true;
    try{
      await apiPost({ action:'add', password: sessionPassword, task:newTask });
      tasks.push(newTask);
      render();
      document.getElementById('in-name').value = '';
      document.getElementById('in-owner').value = '';
      document.getElementById('add-form').classList.remove('open');
    }catch(e){
      alert('Could not save: ' + e.message);
    }
    this.disabled = false;
  });

  document.getElementById('btn-rename').addEventListener('click', async function(){
    var name = prompt('Board name', boardTitle);
    if(!name) return;
    try{
      await apiPost({ action:'setTitle', password: sessionPassword, title:name });
      boardTitle = name;
      document.getElementById('board-title').textContent = boardTitle;
    }catch(e){
      alert('Could not save: ' + e.message);
    }
  });

  function openEdit(id){
    activeId = id;
    var t = tasks.find(function(x){ return x.id === id; });
    if(!t) return;
    document.getElementById('panel-title').textContent = t.name;
    document.getElementById('in-progress').value = t.progress;
    document.getElementById('pct-out').textContent = t.progress;
    document.getElementById('edit-start').value = t.start;
    document.getElementById('edit-end').value = t.end;
    document.getElementById('edit-owner').value = t.owner || '';
    var st = computeStatusColor(t);
    document.getElementById('status-note').textContent = st.label;
    document.getElementById('panel-overlay').classList.add('open');
  }
  document.getElementById('in-progress').addEventListener('input', function(){
    document.getElementById('pct-out').textContent = this.value;
  });
  document.getElementById('btn-cancel-edit').addEventListener('click', function(){
    document.getElementById('panel-overlay').classList.remove('open');
  });
  document.getElementById('btn-save-edit').addEventListener('click', async function(){
    var t = tasks.find(function(x){ return x.id === activeId; });
    if(!t) return;
    var updated = {
      id: t.id,
      name: t.name,
      owner: document.getElementById('edit-owner').value.trim(),
      start: document.getElementById('edit-start').value || t.start,
      end: document.getElementById('edit-end').value || t.end,
      progress: parseInt(document.getElementById('in-progress').value, 10)
    };
    this.disabled = true;
    try{
      await apiPost({ action:'update', password: sessionPassword, task: updated });
      Object.assign(t, updated);
      render();
      document.getElementById('panel-overlay').classList.remove('open');
    }catch(e){
      alert('Could not save: ' + e.message);
    }
    this.disabled = false;
  });
  document.getElementById('btn-delete').addEventListener('click', async function(){
    if(!confirm('Remove this site from the board?')) return;
    try{
      await apiPost({ action:'delete', password: sessionPassword, id: activeId });
      tasks = tasks.filter(function(x){ return x.id !== activeId; });
      render();
      document.getElementById('panel-overlay').classList.remove('open');
    }catch(e){
      alert('Could not delete: ' + e.message);
    }
  });
  document.getElementById('panel-overlay').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('open');
  });

  loadAll();
  startAutoRefresh();
})();
</script>
</body>
</html>
